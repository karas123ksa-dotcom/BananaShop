name: BananaAI code check

on:
  push:
    paths:
      - 'bananaai-bot/**'
      - '.github/workflows/bananaai-check.yml'
  pull_request:
    paths:
      - 'bananaai-bot/**'
      - '.github/workflows/bananaai-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bananaai-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
